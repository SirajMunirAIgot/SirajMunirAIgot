<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="profile-container">
            <div class="profile-picture">
                <img src="https://via.placeholder.com/150" alt="Profile Picture">
            </div>
            <div class="profile-info">
                <h1>Username</h1>
                <p class="bio">This is a short bio about the user. It can span multiple lines and give a brief overview of who they are.</p>
                <div class="profile-stats">
                    <div>
                        <strong>150</strong>
                        <span>Posts</span>
                    </div>
                    <div>
                        <strong>500</strong>
                        <span>Followers</span>
                    </div>
                    <div>
                        <strong>200</strong>
                        <span>Following</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="content">
            <h2>Posts</h2>
            <div class="posts-grid">
                <!-- Placeholder for posts -->
                <div class="post-item"><img src="https://via.placeholder.com/300" alt="Post 1"></div>
                <div class="post-item"><img src="https://via.placeholder.com/300" alt="Post 2"></div>
                <div class="post-item"><img src="https://via.placeholder.com/300" alt="Post 3"></div>
                <div class="post-item"><img src="https://via.placeholder.com/300" alt="Post 4"></div>
                <div class="post-item"><img src="https://via.placeholder.com/300" alt="Post 5"></div>
                <div class="post-item"><img src="https://via.placeholder.com/300" alt="Post 6"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Responsive Profile</p>
    </footer>
</body>
</html>
